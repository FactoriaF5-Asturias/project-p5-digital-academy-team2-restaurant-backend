spring.application.name=goxu

# core
spring.profiles.active=mysql

# base end-points config
api-endpoint=/api

# Docker
spring.docker.compose.enabled=true

# Crea y actualiza las tablas desde las entidades al arrancar.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que ejecuta Hibernate 
spring.jpa.show-sql=true

# Clave secreta para firmar y verificar los JWT (HS512 exige 64 caracteres como mínimo)
jwt.key=goxu-team2-secret-key-for-signing-jwt-tokens-hs512-minimum-64-characters